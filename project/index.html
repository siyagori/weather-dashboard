<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Forecast Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    
</head>
<body class="clear-day">
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🌤 Weather Dashboard</h1>
            <div class="header-controls">
                <div class="temp-toggle">
                    <button class="temp-btn active" data-unit="C">°C</button>
                    <button class="temp-btn" data-unit="F">°F</button>
                </div>
                <button class="btn-location" id="btnLocation">
                    <i class="fas fa-map-marker-alt"></i>
                    Current Location
                </button>
            </div>
        </div>

        <!-- Search Section -->
        <div class="search-section">
            <div class="search-container">
                <input 
                    type="text" 
                    class="search-input" 
                    id="searchInput" 
                    placeholder="Search for a city..."
                    autocomplete="off"
                >
                <i class="fas fa-search search-icon"></i>
                <ul class="autocomplete-list hidden" id="autocompleteList"></ul>
            </div>
        </div>

        <!-- Main Content -->
        <div id="mainContent">
            <!-- Will be populated by JavaScript -->
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
